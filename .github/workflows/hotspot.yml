name: NASA FIRMS Hotspot Monitoring TMK

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmk-firms-update
  cancel-in-progress: false

jobs:
  update-hotspots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests geopandas shapely

      - name: Prepare output files
        run: |
          mkdir -p data
          test -s data/pbph.geojson || { echo "ERROR: data/pbph.geojson tidak ditemukan atau kosong"; exit 1; }
          test -s data/hotspot.geojson || echo '{"type":"FeatureCollection","name":"TMK NASA FIRMS hotspots","features":[]}' > data/hotspot.geojson
          test -f data/hotspot.csv || touch data/hotspot.csv

      - name: Fetch NASA FIRMS and filter PBPH TMK
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/fetch_firms.py

      - name: Validate generated GeoJSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/hotspot.geojson')
          if not p.exists():
              raise SystemExit('ERROR: hotspot.geojson tidak terbentuk')
          obj = json.loads(p.read_text(encoding='utf-8'))
          if obj.get('type') != 'FeatureCollection' or not isinstance(obj.get('features'), list):
              raise SystemExit('ERROR: format GeoJSON tidak valid')
          print(f"GeoJSON valid: {len(obj['features'])} hotspot")
          PY

      - name: Commit updated hotspot data
        run: |
          git config user.name "TMK Hotspot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data untuk di-commit."
          else
            git commit -m "Update NASA FIRMS hotspot data"
            git push
          fi
